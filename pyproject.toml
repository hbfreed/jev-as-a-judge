[project]
name = "jev-as-a-judge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "openai",
]

[project.optional-dependencies]
# The GPU training stack (stormtrooper): `uv sync --extra train`. Pinned to what rl-experiments
# runs; torch is left to vLLM, which hard-pins it.
train = [
    "bitsandbytes>=0.49.2",
    "peft==0.19.1",
    "transformers",
    "vllm==0.24.0",
    "wandb",
]
